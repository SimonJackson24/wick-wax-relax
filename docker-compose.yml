# Docker Compose for Coolify Deployment
# Wick Wax & Relax E-commerce Platform

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wickwax-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - REVOLUT_API_KEY=${REVOLUT_API_KEY}
      - REVOLUT_WEBHOOK_SECRET=${REVOLUT_WEBHOOK_SECRET}
      - ETSY_API_KEY=${ETSY_API_KEY}
      - AMAZON_CLIENT_ID=${AMAZON_CLIENT_ID}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SENTRY_DSN=${SENTRY_DSN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    expose:
      - "3001"
    networks:
      - wickwax-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wickwax-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${BACKEND_URL}
      - NEXT_PUBLIC_SITE_URL=${FRONTEND_URL}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - wickwax-network

networks:
  wickwax-network:
    driver: bridge

volumes:
  backend-data:
  frontend-data:
