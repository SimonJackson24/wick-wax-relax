# Build & publish Docker images to GitHub Container Registry.
# Coolify deploys these images (dockerimage build pack) — every push to
# master ships a fresh pair: ghcr.io/simonjackson24/wwr-backend:latest
# and .../wwr-frontend:latest. Rollback = pin a specific tag in Coolify.
name: Build & Publish Images

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: wwr-backend
            context: .
            dockerfile: ./Dockerfile
          - name: wwr-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR requires lowercase repository names; the GitHub owner can
      # contain capitals (SimonJackson24) — lowercase it once here.
      - name: Compute lowercase image prefix
        id: vars
        run: echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.vars.outputs.prefix }}/${{ matrix.name }}:latest
            ${{ steps.vars.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
          build-args: |
            BUILD_API_URL=https://api.wickwaxrelax.co.uk
          cache-from: type=gha
          cache-to: type=gha,mode=max
