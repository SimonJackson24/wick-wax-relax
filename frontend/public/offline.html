<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#C8B6DB" />
  <title>Wick Wax & Relax — offline</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f2ed;
      --fg: #1c1917;
      --muted: #6b5e54;
      --accent: #7a5b41;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f2ed; --muted: #a8a29e; --accent: #c8b6db; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .badge {
      width: 96px; height: 96px;
      border-radius: 24px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-size: 48px;
      margin-bottom: 24px;
    }
    h1 { font-size: 28px; margin: 0 0 12px; font-weight: 600; }
    p  { font-size: 16px; line-height: 1.5; max-width: 32em; margin: 0 0 12px; color: var(--muted); }
    button {
      margin-top: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: var(--accent); color: white; }
  </style>
</head>
<body>
  <div class="badge" aria-hidden="true">●</div>
  <h1>You're offline</h1>
  <p>You can still browse the products and pages you already visited. New orders, account changes, and searches need a network connection.</p>
  <p>We'll be back as soon as you're online again.</p>
  <button type="button" onclick="history.back()">Go back</button>
</body>
</html>
